<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <h1>Expense Tracker</h1>
        <p>Track your income and expenses with a clean dashboard.</p>
      </header>

      <section class="summary-grid">
        <article class="card balance">
          <h2>Total Balance</h2>
          <p id="balance">$0.00</p>
        </article>
        <article class="card income">
          <h2>Total Income</h2>
          <p id="income">$0.00</p>
        </article>
        <article class="card expense">
          <h2>Total Expenses</h2>
          <p id="expense">$0.00</p>
        </article>
      </section>

      <section class="card form-card">
        <h2>Add Transaction</h2>
        <form id="transaction-form">
          <div class="form-row">
            <label for="type">Type</label>
            <select id="type" required>
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
          </div>
          <div class="form-row">
            <label for="description">Description</label>
            <input id="description" type="text" placeholder="e.g. Salary, Grocery" required />
          </div>
          <div class="form-row">
            <label for="amount">Amount</label>
            <input id="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required />
          </div>
          <button type="submit">Add</button>
        </form>
      </section>

      <section class="card">
        <h2>Transactions</h2>
        <ul id="transaction-list" class="transaction-list"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
